<script>
  (function () {
    var GATE_KEY = 'elmonkey_edad_ok';
    var gate = document.getElementById('age-gate');
    var yaVerificado = localStorage.getItem(GATE_KEY) === '1' || sessionStorage.getItem(GATE_KEY) === '1';

    if (gate && yaVerificado) {
      gate.style.display = 'none';
    }

    var formEdad = document.getElementById('form-edad');
    if (gate && formEdad) {
      formEdad.addEventListener('submit', function (e) {
        e.preventDefault();
        var f = e.target;
        var dia = parseInt(f.dia.value, 10);
        var mes = parseInt(f.mes.value, 10);
        var anio = parseInt(f.anio.value, 10);
        var error = document.getElementById('age-gate-error');

        var nacimiento = new Date(anio, mes - 1, dia);
        var fechaValida = nacimiento.getFullYear() === anio &&
          (nacimiento.getMonth() + 1) === mes &&
          nacimiento.getDate() === dia;

        if (!fechaValida) {
          error.textContent = 'Ingresa una fecha de nacimiento válida.';
          return;
        }

        var hoy = new Date();
        var edad = hoy.getFullYear() - nacimiento.getFullYear();
        var aunNoCumple = (hoy.getMonth() < nacimiento.getMonth()) ||
          (hoy.getMonth() === nacimiento.getMonth() && hoy.getDate() < nacimiento.getDate());
        if (aunNoCumple) edad--;

        if (edad < 18) {
          error.textContent = 'Debes ser mayor de 18 años para ingresar.';
          return;
        }

        if (f.recordar.checked) {
          localStorage.setItem(GATE_KEY, '1');
        } else {
          sessionStorage.setItem(GATE_KEY, '1');
        }
        gate.style.display = 'none';
      });
    }

    var envio = <?!= envio ?>;
    var carrito = {}; // id -> cantidad

    var cards = document.querySelectorAll('.product-card');
    cards.forEach(function (card) {
      var id = card.dataset.id;
      var qtyEl = card.querySelector('.qty-value');
      card.querySelectorAll('.qty-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var actual = carrito[id] || 0;
          actual = (btn.dataset.action === 'mas') ? actual + 1 : Math.max(0, actual - 1);
          carrito[id] = actual;
          qtyEl.textContent = actual;
          actualizarResumen();
        });
      });
    });

    function actualizarResumen() {
      var resumen = document.getElementById('resumen-carrito');
      var btnPagar = document.querySelector('.btn-pagar');
      var ids = Object.keys(carrito).filter(function (id) { return carrito[id] > 0; });

      if (!ids.length) {
        resumen.innerHTML = '<p class="cart-empty">Todavía no has agregado productos.</p>';
        btnPagar.disabled = true;
        document.getElementById('total-final').textContent = '$0.00';
        return;
      }

      var subtotal = 0;
      var html = '';
      ids.forEach(function (id) {
        var card = document.querySelector('.product-card[data-id="' + id + '"]');
        var nombre = card.querySelector('h3').textContent;
        var precio = parseFloat(card.dataset.precio);
        var cantidad = carrito[id];
        subtotal += precio * cantidad;
        html += '<div class="cart-line"><span>' + nombre + ' × ' + cantidad + '</span><span>$' + (precio * cantidad).toFixed(2) + '</span></div>';
      });

      resumen.innerHTML = html;
      document.getElementById('total-final').textContent = '$' + (subtotal + envio).toFixed(2);
      btnPagar.disabled = false;
    }

    document.getElementById('form-pedido').addEventListener('submit', function (e) {
      e.preventDefault();

      var ids = Object.keys(carrito).filter(function (id) { return carrito[id] > 0; });
      if (!ids.length) return;

      var form = e.target;
      var pedido = {
        items: ids.map(function (id) { return { id: id, cantidad: carrito[id] }; }),
        cliente: {
          nombre: form.nombre.value,
          telefono: form.telefono.value,
          departamento: form.departamento.value,
          municipio: form.municipio.value,
          direccion: form.direccion.value
        }
      };

      var btn = document.querySelector('.btn-pagar');
      var mensaje = document.getElementById('mensaje-error');
      btn.disabled = true;
      btn.textContent = 'Generando enlace de pago…';
      mensaje.textContent = '';

      google.script.run
        .withSuccessHandler(function (resp) {
          // window.top es necesario: el contenido de Apps Script corre dentro
          // de un iframe interno de Google, así que hay que redirigir la
          // pestaña completa del navegador, no solo el iframe.
          window.top.location.href = resp.url;
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = 'Pagar con Wompi';
          mensaje.textContent = (err && err.message) ? err.message : 'Ocurrió un error. Intenta de nuevo.';
        })
        .crearPedido(pedido);
    });
  })();
</script>
